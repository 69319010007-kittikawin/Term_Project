<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <div class="login-container">
        <div class="brand-section">
            <div class="brand-content">
                <h1>Welcome Back</h1>
                <p>Access your enterprise dashboard to manage your digital business effectively.</p>
            </div>
            <!-- Illustration Placeholder -->
            <div class="brand-illustration"></div>
        </div>
        <div class="form-section">
            <div class="form-wrapper">
                <div class="mobile-logo">
                    <h2>Enterprise<span class="text-blue">App</span></h2>
                </div>
                <div class="form-header">
                    <h2>Sign In</h2>
                    <p>Please enter your credentials to continue.</p>
                </div>
                <form id="loginForm" class="login-form">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="name@company.com" required autocomplete="username">
                    </div>
                    <div class="input-group">
                        <label class="label-flex" for="password">
                            <span>Password</span>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <div class="remember-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me for 30 days</label>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary">
                        <span class="btn-text">Sign In</span>
                        <div class="spinner" style="display: none;"></div>
                    </button>
                </form>
                <div class="form-footer">
                    <p>Don't have an account? <a href="#">Contact Admin</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="../src/js/app.js"></script>
</body>
</html>
